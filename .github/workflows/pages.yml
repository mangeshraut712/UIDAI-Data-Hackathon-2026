name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/uidai-pages-site-a91e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          if ! gh api "repos/${REPO}/pages" --silent >/dev/null 2>&1; then
            echo "Pages: creating site (workflow build)…"
            jq -n --arg branch "$BRANCH" '{build_type:"workflow",source:{branch:$branch,path:"/"}}' \
              | gh api -X POST "repos/${REPO}/pages" --input -
          else
            BT="$(gh api "repos/${REPO}/pages" --jq .build_type)"
            if [ "$BT" != "workflow" ]; then
              echo "Pages: switching build type to workflow…"
              gh api -X PUT "repos/${REPO}/pages" -f build_type=workflow
            else
              echo "Pages: already configured for GitHub Actions (workflow)."
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/visualizations _site/reports/report
          cp index.html .nojekyll _site/
          cp -R visualizations/charts visualizations/infographics visualizations/interactive _site/visualizations/
          cp "reports/report/UIDAI Data Hackathon 2026 Report.pdf" _site/reports/report/
          cp reports/report/Report_Source.tex _site/reports/report/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
